# handspike-visitors -- the footer counter for handspike.dev.
#
# The leading underscore on this directory is load-bearing: GitHub Pages runs Jekyll, and Jekyll does
# not publish directories that start with one. The source is versioned with the site it serves, but
# handspike.dev/_counter/... is not a URL.
#
# `database_id` is written here by deploy.ps1 after `wrangler d1 create`. It is an identifier, not a
# credential -- reaching the database still requires auth on the Cloudflare account that owns it.
#
# The one real secret, VISITOR_SALT, is NOT in this file and must never be. It is set with
# `wrangler secret put`, lives on Cloudflare, and is what stops the stored hashes from being
# reversible IP addresses.

name = "handspike-visitors"
main = "src/worker.js"
compatibility_date = "2026-09-09"

# No observability, no logpush, no tail consumer. This service exists to know less than it could.
[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "handspike-visitors"
database_id = "96fbefc7-fd07-434e-bed6-dcf0e4d65a6b"
